[project]
name = "ble-hub-backend"
version = "0.1.0"
description = "Backend for BLE wearable scanner and beacon hub"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy>=2.0.0",
  "greenlet>=3.0.0",
  "aiosqlite>=0.20.0",
  "asyncpg>=0.29.0",
  "bleak>=0.22.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.28.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["deploy*", "scripts*", "tests*"]
